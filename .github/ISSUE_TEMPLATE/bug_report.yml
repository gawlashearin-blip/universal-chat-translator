name: Bug report
description: Report a reproducible problem with Universal Chat Translator
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove API keys, private chat, and server addresses before submitting.
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: 1.2.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Minecraft and dependency versions
      placeholder: Minecraft 1.21.11, Fabric Loader 0.18.4, Fabric API ..., Cloth Config ..., Mod Menu ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Translation engine
      options:
        - Google free translation
        - Custom OpenAI-compatible API
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence. Sanitize chat text and configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Do not include API keys, Authorization headers, private chat, or full config files.
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private content.
          required: true
        - label: Only one version of Universal Chat Translator is installed.
          required: true
